name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: user_db
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uapp -papp --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          mypy hsp_user_service

      - name: Unit test
        run: pytest tests/unit -q

      - name: Coverage
        run: pytest --cov=hsp_user_service --cov-report=term-missing --cov-fail-under=70 -q

      - name: Security scan - bandit
        continue-on-error: true
        run: bandit -q -r hsp_user_service

      - name: Security scan - semgrep
        continue-on-error: true
        run: make sast

      - name: Security scan - pip-audit
        continue-on-error: true
        run: pip-audit

      - name: Security scan - trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

      - name: Build docker image
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"
          docker build -t "local/${REPO_NAME}:${GITHUB_SHA}" .

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk container scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"
          snyk container test "local/${REPO_NAME}:${GITHUB_SHA}" \
            --file=Dockerfile \
            --severity-threshold=high

      - name: Start application for OWASP ZAP
        env:
          HSP_USER_SERVICE_USE_MOCK_REPOSITORY: "true"
        run: |
          python -m hsp_user_service.main > "${RUNNER_TEMP}/zap-target.log" 2>&1 &

      - name: Wait for OWASP ZAP target
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/users/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat "${RUNNER_TEMP}/zap-target.log"
          exit 1

      - name: Security scan - OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8080/docs
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Login to Aliyun registry
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login "${{ secrets.ALIYUN_REGISTRY }}" \
            --username "${{ secrets.ALIYUN_USERNAME }}" \
            --password-stdin

      - name: Push docker image to Aliyun
        if: github.ref == 'refs/heads/main'
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"

          LOCAL_IMAGE="local/${REPO_NAME}:${GITHUB_SHA}"
          IMAGE_BASE="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${REPO_NAME}"
          IMAGE_SHA="${IMAGE_BASE}:${GITHUB_SHA}"
          IMAGE_LATEST="${IMAGE_BASE}:latest"

          docker tag "${LOCAL_IMAGE}" "${IMAGE_SHA}"
          docker tag "${LOCAL_IMAGE}" "${IMAGE_LATEST}"

          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_LATEST}"
